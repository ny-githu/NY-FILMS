<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">🎬 CineStream</div>
            <ul class="nav-menu">
                <li><a href="#home" class="nav-link active">Home</a></li>
                <li><a href="#movies" class="nav-link">Movies</a></li>
                <li><a href="#about" class="nav-link">About</a></li>
                <li><a href="#contact" class="nav-link">Contact</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="hero-content">
            <h1>Welcome to CineStream</h1>
            <p>Stream and Download Your Favorite Movies</p>
            <button class="btn btn-primary">Start Watching</button>
        </div>
    </section>

    <!-- Search Bar -->
    <section class="search-section">
        <div class="search-container">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search movies..." 
                class="search-bar"
            >
        </div>
    </section>

    <!-- Movies Grid -->
    <section class="movies-section" id="movies">
        <div class="container">
            <h2>Featured Movies</h2>
            <div class="movies-grid" id="moviesGrid">
                <!-- Movies will be loaded here by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Movie Modal -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-body">
                <video id="moviePlayer" width="100%" controls>
                    <source src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="modal-info">
                    <h2 id="modalTitle"></h2>
                    <p id="modalDescription"></p>
                    <div class="modal-actions">
                        <button class="btn btn-primary" id="playBtn">Play</button>
                        <button class="btn btn-secondary" id="downloadBtn">Download</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 CineStream. All rights reserved.</p>
            <div class="social-links">
                <a href="#" class="social-link">Facebook</a>
                <a href="#" class="social-link">Twitter</a>
                <a href="#" class="social-link">Instagram</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
  </html>
